# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-26.04
    container:
      # OTP 29.1 includes the Alpine x64 signal-stack fix from erlang/otp#11376.
      image: hexpm/elixir:1.20.4-erlang-29.1.2-alpine-3.24.3
    env:
      POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Install runtime packages
      run: apk add --no-cache bash build-base fish git nodejs npm tar
    - uses: actions/checkout@v7
    - name: Restore Mix cache
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        # The workflow hash includes the pinned runtime image and build commands.
        # A commit suffix refreshes immutable caches; restore only compatible builds.
        key: ${{ runner.os }}-${{ runner.arch }}-mix-build-v1-${{ hashFiles('.github/workflows/elixir.yml', 'mix.lock') }}-${{ github.sha }}
        restore-keys: ${{ runner.os }}-${{ runner.arch }}-mix-build-v1-${{ hashFiles('.github/workflows/elixir.yml', 'mix.lock') }}-
    - name: Locate npm cache
      id: npm-cache-directory
      run: echo "path=$(npm config get cache)" >> "$GITHUB_OUTPUT"
    - name: Restore npm downloads
      uses: actions/cache@v6
      with:
        path: ${{ steps.npm-cache-directory.outputs.path }}
        key: ${{ runner.os }}-${{ runner.arch }}-npm-v1-${{ hashFiles('assets/package-lock.json') }}
    - name: Install dependencies
      run: mix deps.get
    - name: Build assets
      run: mix do assets.setup + assets.build
    - name: Run tests
      run: mix test
