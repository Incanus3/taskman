# separate terms of service, privacy policy, and support
# documentation.

name: Elixir CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    container:
      # OTP 27+ Alpine builds can abort on x64 runners until erlang/otp#11376 is released.
      image: hexpm/elixir:1.19.5-erlang-26.2.5.21-alpine-3.24.1
    env:
      POSTGRES_HOST: postgres
    services:
      postgres:
        image: postgres:18.4-alpine3.24
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Install runtime packages
      run: apk add --no-cache bash build-base fish git tar
    - uses: actions/checkout@v4
    - name: Restore dependencies cache
      uses: actions/cache@v4
      with:
        path: deps
        key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
        restore-keys: ${{ runner.os }}-mix-
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test
